[package]
name = "garmin-goblin"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "garmin_goblin_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "custom-protocol"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2.7.1"
tauri-plugin-notification = "2"
tauri-plugin-litert = { path = "../plugins/tauri-plugin-litert" }
tauri-plugin-supertonic = { path = "../plugins/tauri-plugin-supertonic" }
rusqlite = { version = "0.37.0", features = ["bundled"] }
tokio = { version = "1.52.1", features = ["macros", "rt", "rt-multi-thread", "test-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
async-trait = "0.1.89"
regex = "1.12.3"
tokenizers = "0.19"
chrono = { version = "0.4", features = ["serde"] }
rand = "0.8"
hex = "0.4"
base64 = "0.22"
fitparser = "0.11.0"
btleplug = "0.12.0"
jni = "0.19"
sha2 = "0.10"

# Only compile webkit2gtk when building for Desktop Linux (not Android)
[target.'cfg(all(target_os = "linux", not(target_os = "android")))'.dependencies]
webkit2gtk = "2.0.2"

[profile.dev]
opt-level = 3

